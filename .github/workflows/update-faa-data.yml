name: Update FAA Data

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger
    inputs:
      force_deploy:
        description: 'Force deployment even if no data changes'
        required: false
        default: 'false'
        type: boolean

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas
        
    - name: Download and process FAA data
      run: python scripts/update_faa_data.py
      
    - name: Check for changes
      id: git-check
      run: |
        git diff --exit-code public/data/ || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Configure Git remote
      if: steps.git-check.outputs.changed == 'true'
      run: |
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    
    - name: Commit and push changes
      if: steps.git-check.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/data/datafile.csv public/data/part77-data.csv public/data/regions/*.csv
        git commit -m "Update FAA obstacle data - $(date +'%Y-%m-%d')"

        # Try to push, if it fails due to updates, pull and retry
        set +e
        git push
        if [ $? -ne 0 ]; then
          echo "Push failed, pulling latest changes and retrying..."

          # Add any additional unstaged changes that may have been created
          git add public/data/datafile.csv public/data/part77-data.csv public/data/regions/*.csv

          # Stash any changes (staged or unstaged)
          git stash --include-untracked

          # Pull with rebase
          git pull --rebase origin main

          # Pop stash if there were any changes
          if git stash list | grep -q "stash@{0}"; then
            git stash pop
            # Re-add and commit any files that were stashed
            git add public/data/datafile.csv public/data/part77-data.csv public/data/regions/*.csv
            if ! git diff --cached --quiet || ! git diff --quiet; then
              git commit --amend --no-edit
            fi
          fi

          # Push again
          git push
        fi
        set -e
        
    - name: Set up Node.js
      if: steps.git-check.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Node.js dependencies
      if: steps.git-check.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
      run: npm ci

    - name: Build and deploy to GitHub Pages
      if: steps.git-check.outputs.changed == 'true' || github.event.inputs.force_deploy == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        npm run build
        npm run deploy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
