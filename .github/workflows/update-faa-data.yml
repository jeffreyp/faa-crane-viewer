name: Update FAA Data

on:
  schedule:
    # Daily at 6 AM UTC: DOF + Part77 CSVs and NOTAMs
    - cron: '0 6 * * *'
    # Every 3 hours: NOTAMs only
    - cron: '30 */3 * * *'
  workflow_dispatch: # Allow manual trigger (runs everything)

# Every run deploys, and a gh-pages deploy replaces the whole site, so runs must not overlap
concurrency:
  group: update-faa-data
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # DOF + Part77 typically complete in 2-3 minutes
    permissions:
      contents: write
    env:
      # Refresh the FAA CSVs on the daily schedule and manual runs, not the 3-hourly NOTAM runs
      FULL_RUN: ${{ github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * *' }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pandas
        
    - name: Download and process FAA data
      id: download-data
      if: env.FULL_RUN == 'true'
      run: python scripts/update_faa_data.py

    - name: Report failure
      if: failure() && steps.download-data.outcome == 'failure'
      run: |
        echo "## :x: FAA Data Update Failed" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "The FAA data download and processing step failed." >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Timestamp:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Possible causes:" >> $GITHUB_STEP_SUMMARY
        echo "- FAA API endpoints may be down or changed" >> $GITHUB_STEP_SUMMARY
        echo "- Network connectivity issues" >> $GITHUB_STEP_SUMMARY
        echo "- Data format changes from FAA" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Next steps:" >> $GITHUB_STEP_SUMMARY
        echo "1. Check the workflow logs above for specific error messages" >> $GITHUB_STEP_SUMMARY
        echo "2. Verify FAA data sources are accessible:" >> $GITHUB_STEP_SUMMARY
        echo "   - DOF: https://aeronav.faa.gov/Obst_Data/DAILY_DOF_CSV.ZIP" >> $GITHUB_STEP_SUMMARY
        echo "   - OEAAA: https://oeaaa.faa.gov/oeaaa/oe3a/main/#/download" >> $GITHUB_STEP_SUMMARY
        echo "3. Review and update scripts/update_faa_data.py if needed" >> $GITHUB_STEP_SUMMARY

    - name: Fetch crane NOTAMs
      id: notams
      continue-on-error: true
      run: python scripts/update_notam_data.py
      env:
        NMS_CLIENT_ID: ${{ secrets.NMS_CLIENT_ID }}
        NMS_CLIENT_SECRET: ${{ secrets.NMS_CLIENT_SECRET }}
        NMS_HOST: ${{ vars.NMS_HOST }}

    - name: Keep previous NOTAMs on failure
      if: steps.notams.outcome == 'failure'
      run: |
        # notam-cranes.json isn't committed, so reuse the deployed copy (the frontend
        # drops expired entries) rather than deploying without NOTAMs
        curl -fsS -o public/data/notam-cranes.json \
          "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/notam-cranes.json" \
          || echo '{"generatedAt":null,"cranes":[]}' > public/data/notam-cranes.json
        echo "## :warning: NOTAM fetch failed" >> $GITHUB_STEP_SUMMARY
        echo "Deployed the previous NOTAM data instead. Check the 'Fetch crane NOTAMs' step log." >> $GITHUB_STEP_SUMMARY

    - name: Check for changes
      id: git-check
      if: env.FULL_RUN == 'true'
      run: |
        git diff --exit-code public/data/ || echo "changed=true" >> $GITHUB_OUTPUT

    - name: Configure Git remote
      if: steps.git-check.outputs.changed == 'true'
      run: |
        git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
    
    - name: Commit and push changes
      if: steps.git-check.outputs.changed == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add public/data/datafile.csv public/data/part77-data.csv public/data/regions/*.csv
        git commit -m "Update FAA obstacle data - $(date +'%Y-%m-%d')"

        # Try to push, if it fails due to updates, pull and retry
        set +e
        git push
        if [ $? -ne 0 ]; then
          echo "Push failed, pulling latest changes and retrying..."

          # Add any additional unstaged changes that may have been created
          git add public/data/datafile.csv public/data/part77-data.csv public/data/regions/*.csv

          # Stash any changes (staged or unstaged)
          git stash --include-untracked

          # Pull with rebase
          git pull --rebase origin main

          # Pop stash if there were any changes
          if git stash list | grep -q "stash@{0}"; then
            git stash pop
            # Re-add and commit any files that were stashed
            git add public/data/datafile.csv public/data/part77-data.csv public/data/regions/*.csv
            if ! git diff --cached --quiet || ! git diff --quiet; then
              git commit --amend --no-edit
            fi
          fi

          # Push again
          git push
        fi
        set -e
        
    # Always deploy: NOTAMs change on every run
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Node.js dependencies
      run: npm ci

    - name: Build and deploy to GitHub Pages
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        npm run build
        npx gh-pages -d public -r https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
